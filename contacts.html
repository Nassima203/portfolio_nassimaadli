<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts | Nassima Adli</title>
  <link rel="stylesheet" href="contacts.css">
  <link rel="icon" type="image/png" href="favicon.png">

</head>
<body>
    <a href="index.html" class="page-title" title="Retour à l'accueil">CONTACTS</a>

  <section class="contact-section">
    <div class="forme-jaune">
      <h2 class="form-titre">CONTACTEZ MOI</h2>
      
      <form action="#" method="POST" class="formulaire">
        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required>

        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom" name="prenom" required>

        <label for="email">Email :</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message :</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit" class="submit-btn">Envoyer</button>
      </form>
    </div>
  </section>
<script>
document.querySelector('.formulaire').addEventListener('submit', async function(e) {
    e.preventDefault(); // Empêche le rechargement de la page

    const nom = document.getElementById('nom').value;
    const prenom = document.getElementById('prenom').value;
    const email = document.getElementById('email').value;
    const message = document.getElementById('message').value;

    const submitBtn = document.querySelector('.submit-btn');
    submitBtn.textContent = "Envoi en cours...";

    try {
        const response = await fetch('TON_URL_WEBHOOK_MAKE_ICI', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ 
                nom: nom, 
                prenom: prenom, 
                email: email, 
                message: message 
            })
        });

        if (response.ok) {
            submitBtn.textContent = "Message envoyé !";
            document.querySelector('.formulaire').reset();
            setTimeout(() => { submitBtn.textContent = "Envoyer"; }, 3000);
        } else {
            submitBtn.textContent = "Erreur, réessaie";
        }
    } catch (error) {
        console.error('Erreur:', error);
        submitBtn.textContent = "Erreur de connexion";
    }
});
</script>
</body>
</html>
